# 伪装词池配置（mask_style: alias 时生效）
# 说明：
#   - person（人名池）：顺序取用，池内词彼此不应互为前缀
#   - *_suffixes（后缀模板）：按 字母 × 后缀 展开（A市 B市 … Z市 A省 …）
#   - 生成时自动避让原文中已存在的词（防还原撞词）、过滤 Windows 文件名非法字符
#   - 词池耗尽时自动回退 [PERSON_001] 式占位符（还原逻辑不变）
#   - 本文件可自由增删；删除本文件则回退内置默认池
