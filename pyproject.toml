[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mask-tool"
version = "0.1.4"
description = "本地文件脱敏工具 - 支持可逆脱敏、智能识别、多格式办公文件处理"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "WUJinda", email = "Jindaw4@gmail.com"},
]
keywords = ["desensitization", "masking", "docx", "xlsx", "pptx", "pdf", "privacy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "typer>=0.9.0",
    "pyyaml>=6.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "python-pptx>=0.6.23",
    "pymupdf>=1.24.0",
    "rich>=13.0.0",
    "jieba>=0.42.1",
    "requests>=2.28",
    # .doc/.xls 转换式适配（office_convert）的 Windows COM 引擎依赖；
    # macOS/ 非 Windows 由环境标记自动跳过，走 LibreOffice 兑底引擎
    "pywin32>=306; sys_platform == 'win32'",
    # 锁 1.64.x：UI 层（CSS 覆盖 + 自定义组件）依赖 Streamlit 内部 DOM 结构
    # （data-testid 等），语义化版本承诺对其无效；minor 升级需人工回归后再放行
    "streamlit>=1.64,<1.65",
    "pandas>=1.4.0",
]

[project.optional-dependencies]
# 桌面应用完整依赖（UI 内核 streamlit/pandas 已在基础依赖中）
app = [
    "streamlit-aggrid>=0.3.0",
    "pywebview>=5.0",
]
ner-hanlp = [
    "hanlp>=2.1.0",
    "torch>=2.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.urls]
repository = "https://github.com/WUJinda/MaskTool"

[project.scripts]
mask-tool = "mask_tool.cli.app:app"
mask-tool-desktop = "mask_tool.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    # 真实转换引擎（启动 Word/Excel COM 或 LibreOffice）的 round-trip 用例：
    # 慢（单用例 1-3 分钟）、对机器 Office 状态敏感（未激活弹窗/Resiliency
    # 恢复框会挂到 watchdog 超时），默认排除；显式跑：pytest -m real_engine
    "real_engine: 需本机真实 MS Office/LibreOffice 转换引擎的用例（慢，默认排除）",
]
addopts = "-m 'not real_engine'"
