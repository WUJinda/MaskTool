<svg width="360" height="96" viewBox="0 0 360 96" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="mask-tool 横向 Logo">
  <!-- mask-tool 横向 Logo（深色主题 UI 内展示：图标 + 文字）
       文字白色适配深色界面；字体栈优先 Segoe UI（Windows 桌面环境必有） -->
  <!-- 图标（与应用图标同构，72×72） -->
  <g transform="translate(12,12)">
    <rect x="0" y="0" width="72" height="72" rx="16" fill="#1E2440"/>
    <rect x="18.5" y="14" width="35" height="44" rx="3" fill="#FFFFFF"/>
    <polygon points="43.5,14 53.5,24 43.5,24" fill="#D9DEEB"/>
    <rect x="24" y="22" width="23" height="5.5" rx="1.5" fill="#5B6EE8"/>
    <rect x="24" y="31" width="17" height="5.5" rx="1.5" fill="#5B6EE8"/>
    <rect x="24" y="42" width="23" height="2.5" rx="1.25" fill="#C9CEDC"/>
  </g>
  <!-- 文字 -->
  <text x="100" y="48" dominant-baseline="central"
        font-family="'Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif"
        font-size="34" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">mask-tool</text>
</svg>
